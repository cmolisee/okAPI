<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>okAPI: API Mocking</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <!-- 
    1. right click API in network tab
    2. copy -> copy HAR
    3. paste in mock panel
    3. initialize mock that is 1-1 with the original
        - include all metadata
        - also include the env the request was made on
    4. allow user to modify the request url
        - priority on most specific matching request URL first via regex
        - method must match or wont be mocked
        - allows wild card
        - allows "env" variables that can be created and referenced in both url and request for hot swapping
    5. allow user to modify request body
        - json only to start maybe expand elsewhere later
    6. allow user to modify headers
        - enable/disable
        - future enhancement to use script that generates a header based on certain criteria
    7. allow user to modify request body
        - JSON only (future enhancment for other formats possibly)
  -->
  <body>
    <header class="toolbar">
      <div>
        <button id="toggle-network-viewer-enabled" disabled />
        <button id="toggle-mocking-enabled" disabled />
        <button id="toggle-notifications-enabled" disabled />
        <span class="engine-label" id="engine-label"></span>
      </div>
      <div role="tablist" aria-label="okAPI tabs">
        <button 
          role="tab" 
          aria-selected="true" 
          aria-controls="network-viewer" 
          id="tab-network-viewer" 
          tabindex="0">
          Network Viewer
        </button>
        <button 
          role="tab" 
          aria-selected="true" 
          aria-controls="mock-viewer" 
          id="tab-mock-viewer" 
          tabindex="0">
          Mock Viewer
        </button>
    </div>
    </header>



    <main class="layout">
      <section class="pane pane--list" id="panel-viewer">
        <div id="network-viewer" role="tabpanel" aria-labelledby="tab-network-viewer" tabindex="0">
          <p class="empty-hint">No requests captured yet.</p>
        </div>

        <div id="mock-viewer" role="tabpanel" aria-labelledby="tab-mock-viewer" tabindex="0">
          <p class="empty-hint">No mocks created yet.</p>
        </div>
      </section>


      <!-- Detail / editor -->
      <section class="pane pane--detail" id="panel-details">
        <div id="network-details" aria-labelledby="tab-network-details" tabindex="0">
          <div class="detail-placeholder">Select a request to inspect or modify it.</div>

          <div class="detail-content hidden">
            <div class="detail-meta" id="detail-meta"></div>

            <div class="tabs">
              <button class="tab active" data-tab="response">Response</button>
              <button class="tab" data-tab="request">Request</button>
              <button class="tab" data-tab="headers">Headers</button>
            </div>

            <div class="tab-body" id="tab-response">
              <textarea id="editor-body" spellcheck="false" placeholder="Response body"></textarea>
            </div>
            <div class="tab-body hidden" id="tab-request">
              <pre id="view-request-body"></pre>
            </div>
            <div class="tab-body hidden" id="tab-headers">
              <pre id="view-headers"></pre>
            </div>

            <div class="detail-actions">
              <button id="btn-override">Apply Override</button>
              <button id="btn-passthrough">Pass Through</button>
            </div>
          </div>
        </div>

        <div id="mock-details" aria-labelledby="tab-mock-details" tabindex="0">
          <div class="detail-placeholder">Select a request to inspect or modify it.</div>

          <div class="detail-content hidden">
            <div class="detail-meta" id="detail-meta"></div>

            <div class="tabs">
              <button class="tab active" data-tab="response">Response</button>
              <button class="tab" data-tab="request">Request</button>
              <button class="tab" data-tab="headers">Headers</button>
            </div>

            <div class="tab-body" id="tab-response">
              <textarea id="editor-body" spellcheck="false" placeholder="Response body"></textarea>
            </div>
            <div class="tab-body hidden" id="tab-request">
              <pre id="view-request-body"></pre>
            </div>
            <div class="tab-body hidden" id="tab-headers">
              <pre id="view-headers"></pre>
            </div>

            <div class="detail-actions">
              <button id="btn-override">Apply Override</button>
              <button id="btn-passthrough">Pass Through</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
