<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.type" content="browser_action" />
    <link rel="stylesheet" href="style.css" />
    <title>okAPI: API Mocking</title>
  </head>
  <body>
    <div>
        <div class="select-container">
            <label for="theme-select" id="theme-label" class="select-label">
                Choose Theme
            </label>
            <div class="select-wrapper">
                <select 
                    id="theme-select" 
                    name="theme" 
                    aria-labelledby="theme-label"
                    required
                >
                <option value="system" selected>System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                </select>
                <span class="select-arrow" aria-hidden="true"></span>
            </div>
        </div>

        <div class="checkbox-item">
            <input type="checkbox" id="enableNotifications" name="enableNotifications" value="enableNotifications">
            <label for="enableNotifications">Enable Popup Notifications</label>
        </div>

        <div class="checkbox-item">
            <input type="checkbox" id="enableMocking" name="enableMocking" value="enableMocking">
            <label for="enableMocking">Enable Mocking</label>
        </div>

        <div class="checkbox-item">
            <input type="checkbox" id="enableNetworkViewer" name="enableNetworkViewer" value="enableNetworkViewer">
            <label for="enableNetworkViewer">Enable Network Viewer</label>
        </div>
        
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
