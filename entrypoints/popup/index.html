<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.type" content="browser_action" />
    <link rel="stylesheet" href="style.css" />
    <title>okAPI: API Mocking</title>
  </head>
  <body>
    <fieldset>
        <label for="theme-select" id="theme-label">Choose Theme</label>
        <div class="select-wrapper">
            <select id="theme-select">
                <option value="system" selected>System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <span class="arrow"/>
        </div>
        
        <div class="checkbox-wrapper">
            <label for="enableNotifications">Enable Popup Notifications</label>
            <input id="enableNotifications" type="checkbox">
        </div>
        
        <div class="checkbox-wrapper">
            <label for="enableMocking">Enable Mocking</label>
            <input id="enableMocking" type="checkbox">
        </div>
        
        <div class="checkbox-wrapper">
            <label for="enableNetworkViewer">Enable Network Viewer</label>
            <input id="enableNetworkViewer" type="checkbox">
        </div>
        
    </fieldset>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
