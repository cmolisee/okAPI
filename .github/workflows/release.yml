name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build Chrome (MV3)
        run: npx wxt build --browser chrome
      - name: Zip Chrome
        run: npx wxt zip --browser chrome

      - name: Build Firefox (MV3)
        # Firefox MV3 retains blocking webRequest — no --mv2 flag needed.
        run: npx wxt build --browser firefox
      - name: Zip Firefox
        run: npx wxt zip --browser firefox
 
      # Safari outputs an Xcode project — attach it as an artifact for manual signing
      - name: Build Safari (Xcode project)
        run: npx wxt build --browser safari
 
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            .output/*.zip
 